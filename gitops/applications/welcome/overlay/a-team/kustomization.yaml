
namespace: a-team

resources:
  - ../../base
  - secret.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - target:
      kind: Service
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: welcome-sops-kustomize
  - path: service.yaml

  - target:
      kind: Route
      name: .*
    patch: |-
      - op: replace
        path: /metadata/name
        value: welcome-sops-kustomize
  - path: route.yaml
